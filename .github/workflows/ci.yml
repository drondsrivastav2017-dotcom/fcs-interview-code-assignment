name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# least privilege: the pipeline only needs to read the repository
permissions:
  contents: read

# a new push to the same branch supersedes the previous run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and check coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: java-assignment

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build, run the tests and enforce the coverage threshold
        run: |
          chmod +x ./mvnw
          ./mvnw -B --no-transfer-progress clean verify

      - name: Publish the coverage summary
        if: always()
        run: |
          report=target/site/jacoco/jacoco.csv
          if [ ! -f "$report" ]; then
            echo "No coverage report was produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          awk -F, 'NR > 1 {
              instructionsMissed += $4; instructionsCovered += $5;
              branchesMissed += $6; branchesCovered += $7;
              linesMissed += $8; linesCovered += $9
            } END {
              printf "## Test coverage\n\n| Metric | Covered |\n| --- | --- |\n";
              printf "| Instructions | %.1f%% |\n", 100 * instructionsCovered / (instructionsCovered + instructionsMissed);
              printf "| Branches | %.1f%% |\n", 100 * branchesCovered / (branchesCovered + branchesMissed);
              printf "| Lines | %.1f%% |\n", 100 * linesCovered / (linesCovered + linesMissed);
            }' "$report" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            java-assignment/target/surefire-reports
            java-assignment/target/site/jacoco
          if-no-files-found: ignore

      # the deployable produced by this pipeline: run it with
      # `java -jar quarkus-app/quarkus-run.jar`
      - name: Upload the runnable application
        uses: actions/upload-artifact@v4
        with:
          name: quarkus-app
          path: java-assignment/target/quarkus-app
          if-no-files-found: error
          retention-days: 7

%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=quarkus_test
%prod.quarkus.datasource.password=quarkus_test
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:15432/quarkus_test
%prod.quarkus.datasource.jdbc.max-size=8
%prod.quarkus.datasource.jdbc.min-size=2

# Optional profile to run the application without Docker or a PostgreSQL server:
#   ./mvnw package -Plocal-h2 -Dquarkus.profile=local
#   java -Dquarkus.profile=local -jar target/quarkus-app/quarkus-run.jar
%local.quarkus.datasource.db-kind=h2
%local.quarkus.datasource.username=sa
%local.quarkus.datasource.password=
%local.quarkus.datasource.jdbc.url=jdbc:h2:mem:fulfilment;DB_CLOSE_DELAY=-1

# Optional profile to run against a local MySQL, to inspect the data with MySQL Workbench:
#   ./mvnw quarkus:dev -Plocal-mysql -Dquarkus.profile=mysql
# MySQL has no sequences, so it needs its own seed script.
%mysql.quarkus.datasource.db-kind=mysql
%mysql.quarkus.datasource.username=${MYSQL_USER:quarkus_test}
%mysql.quarkus.datasource.password=${MYSQL_PASSWORD:quarkus_test}
%mysql.quarkus.datasource.jdbc.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:fulfilment}
%mysql.quarkus.hibernate-orm.sql-load-script=import-mysql.sql

# The test suite runs on an in-memory database so it does not depend on a Docker daemon
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:fulfilment;DB_CLOSE_DELAY=-1
%test.quarkus.hibernate-orm.log.sql=false

# coverage data is collected by the quarkus-jacoco extension and reported by the maven plugin
%test.quarkus.jacoco.report=false
%test.quarkus.jacoco.excludes=**/com/warehouse/api/**

quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.sql-load-script=import.sql

quarkus.openapi.generator.spec=warehouse-openapi.yaml
quarkus.openapi.generator.base-package=com.warehouse.api
